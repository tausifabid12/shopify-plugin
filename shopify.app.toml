# Shopify CLI app configuration.
#
# Only needed to deploy the theme app extension in `extensions/` — the Next.js
# app handles OAuth itself in src/app/api/auth and doesn't use the CLI at
# runtime.
#
# Setup: see SHOPIFY-SETUP.md. Check it with `npm run checkout:doctor`.
#
#   client_id       — your app's Client ID (the SAME value as SHOPIFY_API_KEY)
#   application_url — your public HTTPS origin (the tunnel URL while testing),
#                     and it must match APP_URL in .env.local
#
# Do NOT run `shopify app config link` — it overwrites this file from the
# Partner Dashboard and would drop the scopes below. Paste the client_id by
# hand instead; `shopify app deploy` only needs that.

client_id = "e9a3ceea44206fa1d3f32b4348ce235b"
name = "PingGo"
# `handle` is deliberately absent.
#
# Listing it here makes every deploy try to SET the app's handle, and Shopify
# rejects that if anything in the organisation already holds it —
# "app_handle: App handle must be unique", which is confusing because the
# conflict is usually with this very app.
#
# The app is identified by `client_id` above, so omitting the handle simply
# leaves whatever the app already has. If you ever do need to change it, do it
# in the Partner Dashboard.
#
# Note: the handle is what appears in
# https://admin.shopify.com/store/<store>/apps/<handle>, which the OAuth
# callback redirects to. If it is not "pinggo", set SHOPIFY_APP_HANDLE in the
# app's environment to match.
application_url = "https://shopify.getcreator.online"

# Embedded — the app renders inside the Shopify admin.
#
# Third-party cookies do not survive that iframe, so the session is not carried
# in from a previous login. Instead:
#
#   1. App Bridge mints a short-lived session token identifying the shop.
#   2. The app verifies it (HS256, our client secret) and asks the PingGo
#      backend for that store's vendor session.
#   3. That session is stored in a PARTITIONED cookie, which browsers do allow
#      inside an iframe.
#
# See src/lib/embedded-session.ts and SHOPIFY-SETUP.md § "Embedded mode".
#
# The first link between a store and a PingGo account still happens top-level,
# because Shopify's OAuth consent screen refuses to be framed.
embedded = true

[access_scopes]
# Checkout needs:
#   read_products      — pricing the cart server-side from the real catalogue
#   write_orders       — creating the order once payment is verified
#   write_draft_orders — draftOrderCalculate, which quotes tax and shipping
#                        from the merchant's own Shopify settings. Nothing is
#                        written; Shopify gates the calculation behind the
#                        write scope regardless.
# The rest serve the WhatsApp automations that already ship in this app.
scopes = "read_orders,write_orders,write_draft_orders,read_products,write_products,read_customers,read_fulfillments"

[auth]
# Must also be listed under "Allowed redirection URL(s)" in the Partner
# Dashboard — Shopify checks the dashboard value, not this file.
redirect_urls = [
  "https://shopify.getcreator.online/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

[pos]
embedded = false

[build]
