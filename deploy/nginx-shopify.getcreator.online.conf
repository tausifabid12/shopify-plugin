# /etc/nginx/sites-available/shopify.getcreator.online
#
# Reverse proxy for the Next.js app (next start on 127.0.0.1:3003).
#
# Differences from the original, and why:
#
#  1. `Connection "upgrade"` was hard-coded, so EVERY request — including the
#     POSTs that Server Actions use — was told to upgrade the connection. That
#     is only correct for WebSockets. The `map` below sends `upgrade` when the
#     client actually asked for one and `close` otherwise, which is the standard
#     pattern.
#
#  2. Added `X-Forwarded-Host`. Next prefers it over `Host` when deciding
#     whether a Server Action request is same-origin, and several other
#     framework paths read it too.
#
#  3. Added `client_max_body_size`. Server Actions POST through the proxy, and
#     nginx's 1 MB default silently 413s anything larger — including a modest
#     logo upload.

# Must live at http{} level. Files in sites-available are included inside
# http{}, so declaring it here at the top of the file (outside `server`) works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name shopify.getcreator.online;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3003;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold Next route can take a moment; don't 504 mid-OAuth.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Redirects are built by the app from APP_URL, so nginx must not
        # rewrite Location headers on top of that.
        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shopify.getcreator.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shopify.getcreator.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = shopify.getcreator.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name shopify.getcreator.online;
    return 404; # managed by Certbot
}
